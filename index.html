<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Иврит — Разговорные Фразы</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .hebrew-text { font-family: 'Rubik', sans-serif; direction: rtl; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

  <!-- ШАПКА -->
  <header class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-4">
    <div>
      <h1 class="text-base font-bold text-indigo-600"><i class="fa-solid fa-comment-dots"></i> Иврит Фразы</h1>
      <p class="text-xs text-slate-400">Детсад • Больница • Соседи • CNC</p>
    </div>
    <div class="text-right">
      <span class="text-xs text-slate-500 block">На сегодня:</span>
      <span id="remaining-count" class="text-lg font-bold text-indigo-600">0</span>
    </div>
  </header>

  <!-- КАРТОЧКА -->
  <main class="flex-1 flex flex-col justify-center">
    <div id="card-wrapper" class="bg-white border border-slate-200 rounded-3xl p-6 shadow-md text-center relative flex flex-col justify-between min-h-[320px]">
      
      <!-- Категория -->
      <span id="card-category" class="text-[10px] font-bold uppercase tracking-wider text-indigo-500 bg-indigo-50 px-3 py-1 rounded-full self-center">
        Тема
      </span>

      <!-- Текст карточки -->
      <div class="my-auto py-4">
        <!-- Фраза на иврите -->
        <div id="card-hebrew" class="hebrew-text text-3xl sm:text-4xl font-bold text-slate-800 mb-3 leading-relaxed">
          שָׁלוֹם, מָה נִשְׁמָע?
        </div>
        
        <!-- Транскрипция ЛАТИНИЦЕЙ -->
        <div id="card-transcription" class="text-base font-semibold text-indigo-600 tracking-wide">
          [Shalom, ma nishma?]
        </div>
      </div>

      <!-- Кнопки «Перевод» и «Теория» -->
      <div class="flex gap-2 justify-center">
        <button id="btn-show-translation" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 px-4 rounded-xl text-sm transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-eye"></i> Перевод
        </button>
        <button id="btn-show-theory" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold py-2.5 px-4 rounded-xl text-sm transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-book-open"></i> Теория
        </button>
      </div>

    </div>

    <!-- Финишный экран -->
    <div id="empty-state" class="hidden text-center py-12 bg-white rounded-3xl p-6 border border-slate-200 shadow-sm">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <h3 class="text-xl font-bold text-slate-800 mb-1">Все фразы на сегодня пройдены!</h3>
      <p class="text-slate-500 text-sm mb-4">Возвращайтесь завтра за новыми фразами и повторением.</p>
      <button id="btn-restart" class="text-xs text-indigo-600 font-semibold hover:underline">Пройти текущий круг еще раз</button>
    </div>
  </main>

  <!-- КНОПКИ ДЕЙСТВИЯ -->
  <footer id="action-buttons" class="grid grid-cols-2 gap-3 mt-4">
    <button id="btn-forget" class="bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-600 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition">
      <i class="fa-solid fa-xmark text-lg"></i> Не помню
    </button>
    <button id="btn-remember" class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-600 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition">
      <i class="fa-solid fa-check text-lg"></i> Помню
    </button>
  </footer>

  <!-- МОДАЛЬНОЕ ОКНО ПЕРЕВОДА -->
  <div id="translation-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-xl transform transition-all border border-slate-100">
      <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Перевод на русский</h4>
      <p id="modal-russian-text" class="text-xl font-bold text-slate-800 mb-6 leading-normal">
        Привет, как дела?
      </p>
      <button id="btn-close-modal" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl hover:bg-indigo-700 transition">
        Понятно
      </button>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ТЕОРИИ -->
  <div id="theory-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-xl transform transition-all border border-slate-100 text-left">
      <div class="flex justify-between items-center mb-3">
        <h4 class="text-xs font-bold uppercase tracking-wider text-indigo-500">Грамматика и разбор</h4>
        <button id="btn-close-theory-x" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="modal-theory-text" class="text-sm text-slate-700 space-y-2 leading-relaxed mb-6 max-h-[60vh] overflow-y-auto">
        <!-- Текст теории подставится JS-ом -->
      </div>
      <button id="btn-close-theory" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl hover:bg-indigo-700 transition">
        Понятно
      </button>
    </div>
  </div>

  <script>
    // БАЗА ФРАЗ
    const basePhrasesDB = [
      { id: 1, hebrew: "בְּבַקָּשָׁה לַחְתֹּךְ אֶת הַפָּנֶל לְפִי הַמִּדּוֹת", transcription: "Bevakasha lakhtokh et hapanel lefi hamidot", russian: "Пожалуйста, разрежьте панель по размерам", category: "Столярка и CNC", theory: "• <b>בבקשה</b> (бевакаша) — пожалуйста.<br>• <b>לחתוך</b> (лахтох) — инфинитив глагола 'резать' (биньян пааль). В вежливых просьбах часто используется инфинитив.<br>• <b>את</b> (эт) — предлог винительного падежа.<br>• <b>לפי</b> (лефи) — предлог 'по / согласно'.<br>• <b>המידות</b> (а-мидот) — 'размеры' с артиклем <b>ה</b>." },
      { id: 2, hebrew: "הַיֶּלֶד אָכַל אֶת כָּל הָאֲרוּחָה הַיּוֹם?", transcription: "Hayeled akhal et kol haarukha hayom?", russian: "Ребенок съел сегодня весь обед?", category: "Детский сад", theory: "• <b>הילד</b> (а-йелед) — ребенок с определенным артиклем.<br>• <b>אכל</b> (ахаль) — глагол 'ел/съел' в прошедшем времени (он).<br>• <b>את כל הארוחה</b> (эт коль а-аруха) — 'весь обед' (прямое дополнение с предлогом <b>את</b>).<br>• <b>היום</b> (а-йом) — сегодня (буквально 'этот день')." },
      { id: 3, hebrew: "יֵשׁ לִי תּוֹר לָרוֹפֵא בְּשָׁעָה עֶשֶׂר", transcription: "Yesh li tor larofe besha'a eser", russian: "У меня запись к врачу в 10 часов", category: "Больница", theory: "• <b>יש לי</b> (еш ли) — конструкция 'у меня есть'.<br>• <b>תור</b> (тор) — очередь / запись на прием.<br>• <b>לרופא</b> (ла-рофэ) — предлог <b>ל</b> (к) + артикль + <b>רופא</b> (врач).<br>• <b>בשעה עשר</b> (бе-шаа эсер) — в 10 часов (буквально 'в час десять')." },
      { id: 4, hebrew: "סְלִיחָה, יֵשׁ נְזִילַת מַיִם מֵהַדִּירָה שֶׁלְּךָ", transcription: "Slikha, yesh nezilat mayim mehadira shelkha", russian: "Извините, из вашей квартиры протекает вода", category: "Соседи", theory: "• <b>סליחה</b> (слиха) — извините / простите.<br>• <b>נזילת מים</b> (незилат маим) — сопряжение (смихут): 'утечка воды'. Слово <b>נזילה</b> меняет окончание на <b>ת</b>.<br>• <b>מהדירה שלך</b> (ме-а-дира шельха) — из твоей/вашей квартиры (предлог <b>מ</b> + артикль + квартира + притяжательное слово)." },
      { id: 5, hebrew: "צָרִיךְ לְהַחְלִיף אֶת הַסַּכִּין בַּמַּכְרְסֵם", transcription: "Tsarikh lehakhlif et hasakin bamakhresem", russian: "Нужно заменить фрезу во фрезере", category: "Столярка и CNC", theory: "• <b>צריך</b> (царих) — нужно / должен.<br>• <b>להחליף</b> (лехахлиф) — инфинитив глагола 'менять/поменять' (биньян гифъиль).<br>• <b>הסכין</b> (а-сакин) — лезвие / фреза (буквально 'нож').<br>• <b>במכרסם</b> (ба-махресем) — во фрезере / фрезерном станке (предлог <b>ב</b> + артикль)." }
    ];

    let masterPhrases = JSON.parse(localStorage.getItem('hebrew_phrases_master')) || basePhrasesDB;
    let progressData = JSON.parse(localStorage.getItem('hebrew_phrases_progress')) || {}; 

    let todayQueue = [];

    function buildTodayQueue() {
      const todayStr = new Date().toISOString().split('T')[0];
      const fourteenDaysAgo = new Date(Date.now() - 14 * 24 * 60 * 60 * 1000);

      todayQueue = masterPhrases.filter(phrase => {
        const history = progressData[phrase.id] || [];
        
        if (history.length === 0) return true;

        const firstSuccess = new Date(history[0]);
        const answeredToday = history.includes(todayStr);

        return (firstSuccess >= fourteenDaysAgo) && !answeredToday;
      });

      todayQueue.sort(() => Math.random() - 0.5);
    }

    const elHebrew = document.getElementById('card-hebrew');
    const elTrans = document.getElementById('card-transcription');
    const elCat = document.getElementById('card-category');
    const elRemaining = document.getElementById('remaining-count');
    
    const cardWrapper = document.getElementById('card-wrapper');
    const actionButtons = document.getElementById('action-buttons');
    const emptyState = document.getElementById('empty-state');
    
    const transModal = document.getElementById('translation-modal');
    const theoryModal = document.getElementById('theory-modal');
    const modalRussianText = document.getElementById('modal-russian-text');
    const modalTheoryText = document.getElementById('modal-theory-text');

    function renderCard() {
      if (todayQueue.length === 0) {
        cardWrapper.classList.add('hidden');
        actionButtons.classList.add('hidden');
        emptyState.classList.remove('hidden');
        elRemaining.textContent = 0;
        return;
      }

      cardWrapper.classList.remove('hidden');
      actionButtons.classList.remove('hidden');
      emptyState.classList.add('hidden');

      const current = todayQueue[0];
      elHebrew.textContent = current.hebrew;
      elTrans.textContent = `[${current.transcription}]`;
      elCat.textContent = current.category;
      modalRussianText.textContent = current.russian;
      modalTheoryText.innerHTML = current.theory || "Грамматический разбор для этой фразы пока не добавлен.";

      elRemaining.textContent = todayQueue.length;
    }

    function handleAnswer(remembered) {
      if (todayQueue.length === 0) return;
      
      const current = todayQueue.shift();
      const todayStr = new Date().toISOString().split('T')[0];

      if (remembered) {
        if (!progressData[current.id]) {
          progressData[current.id] = [];
        }
        if (!progressData[current.id].includes(todayStr)) {
          progressData[current.id].push(todayStr);
        }
        localStorage.setItem('hebrew_phrases_progress', JSON.stringify(progressData));
      } else {
        delete progressData[current.id];
        localStorage.setItem('hebrew_phrases_progress', JSON.stringify(progressData));
        todayQueue.push(current);
      }

      renderCard();
    }

    document.getElementById('btn-remember').addEventListener('click', () => handleAnswer(true));
    document.getElementById('btn-forget').addEventListener('click', () => handleAnswer(false));
    
    // Модальные окна
    document.getElementById('btn-show-translation').addEventListener('click', () => transModal.classList.remove('hidden'));
    document.getElementById('btn-close-modal').addEventListener('click', () => transModal.classList.add('hidden'));

    document.getElementById('btn-show-theory').addEventListener('click', () => theoryModal.classList.remove('hidden'));
    document.getElementById('btn-close-theory').addEventListener('click', () => theoryModal.classList.add('hidden'));
    document.getElementById('btn-close-theory-x').addEventListener('click', () => theoryModal.classList.add('hidden'));

    document.getElementById('btn-restart').addEventListener('click', () => {
      buildTodayQueue();
      renderCard();
    });

    localStorage.setItem('hebrew_phrases_master', JSON.stringify(masterPhrases));

    buildTodayQueue();
    renderCard();
  </script>
</body>
</html>
